[[permission]]
identifier = "github-publishing"
description = "Allows only the bundled local CMS to authorize the configured GitHub App and publish a reviewed recipe plan."
commands.allow = [
  "github_get_connection_status",
  "github_begin_device_flow",
  "github_poll_device_flow",
  "github_cancel_device_flow",
  "github_open_device_page",
  "github_open_actions_page",
  "github_disconnect",
  "github_list_cms_history",
  "github_get_cms_history_details",
  "github_load_history_content",
  "github_prepare_content_restore",
  "github_list_published_recipes",
  "github_load_published_recipe",
  "github_list_published_pages",
  "github_load_published_page",
  "github_load_site_configuration",
  "github_prepare_site_publish",
  "github_analyze_page_delete",
  "github_prepare_page_delete",
  "github_prepare_page_publish",
  "github_analyze_recipe_delete",
  "github_prepare_recipe_delete",
  "github_prepare_recipe_publish",
  "github_publish_recipe"
]
