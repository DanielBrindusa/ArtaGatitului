[package]
name = "artagatitului"
version = "0.1.0"
description = "Local desktop and Android authoring shell for Arta Gatitului"
authors = ["Arta Gatitului"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "artagatitului_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.11.6", features = ["unstable"] }
tauri-plugin-opener = "=2.5.5"
