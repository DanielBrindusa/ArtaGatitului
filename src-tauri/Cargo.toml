[package]
name = "artagatitului"
version = "1.0.0"
description = "Local desktop and Android authoring shell for Arta Gatitului"
authors = ["Arta Gatitului"]
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "artagatitului_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.23.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
imagesize = { version = "=0.15.0", default-features = false, features = ["jpeg", "png", "webp"] }
keyring-core = "=1.0.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["form", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.6", features = ["unstable"] }
tauri-plugin-opener = "=2.5.5"
tokio = { version = "=1.53.1", features = ["sync"] }
uuid = { version = "=1.26.1", features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "=1.0.0"
ndk-context = "=0.1.1"
